name: “Sync upstream releases”

on:
  schedule:
    - cron: '0 4 * * 1' # weekly check every Monday at 04:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags for comparisons :contentReference[oaicite:16]{index=16}
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/chibisafe/chibisafe.git
          git fetch upstream --depth=1 +refs/tags/*:refs/tags/*
      - name: Determine latest upstream tag
        id: tag
        run: |
          echo "::set-output name=CHIBI_TAG::$(git tag -l 'v*' --sort=creatordate | tail -n1)"
      - name: Check if this is new
        id: compare
        run: |
          if git rev-parse "$GITHUB_REF" | grep -q "$GITHUB_SHA"; then
            echo "already up-to-date"
            exit 1
          fi
      - name: Merge into main, rebase branding, push
        if: steps.compare.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout main
          git merge --no-ff ${{ steps.tag.outputs.CHIBI_TAG }} -m "chibisafe upstream ${CHIBI_TAG}"
          git push origin main
          git checkout branding
          git rebase main
          git push origin branding --force
      - name: Notify results
        run: echo "Merged upstream tag ${{ steps.tag.outputs.CHIBI_TAG }}; branding is rebased"
